name: build

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test ScanCore
        working-directory: ScanCore
        run: swift test

  ios-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project Facet3D.xcodeproj \
            -scheme Facet3D \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
